<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Review</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" id="brand" href="#"></a>
    <div class="title-wrap">
      <h1 id="projectTitle">Loading…</h1>
      <span id="projectClient" class="muted"></span>
    </div>
    <div class="top-actions">
      <select id="versionSelect" aria-label="Version"></select>
      <a id="downloadBtn" class="btn ghost" hidden target="_blank" rel="noopener"></a>
    </div>
  </header>

  <main class="review">
    <section class="player-col">
      <div class="player" id="player">
        <video id="video" playsinline preload="metadata"></video>
        <div class="big-play" id="bigPlay" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </div>
        <div class="video-error" id="videoError" hidden></div>
      </div>

      <div class="controls">
        <button class="icon" id="playBtn" aria-label="Play (space)">
          <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
        </button>
        <button class="icon" id="prevFrame" aria-label="Previous frame (←)">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
        </button>
        <button class="icon" id="nextFrame" aria-label="Next frame (→)">
          <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
        </button>
        <div class="tc"><span id="tcNow">00:00:00:00</span><span class="muted"> / <span id="tcDur">00:00:00:00</span></span></div>
        <div class="scrub" id="scrub">
          <div class="scrub-track">
            <div class="scrub-buffer" id="scrubBuffer"></div>
            <div class="scrub-fill" id="scrubFill"></div>
          </div>
          <div class="scrub-markers" id="scrubMarkers"></div>
          <div class="scrub-hover" id="scrubHover" hidden></div>
        </div>
        <button class="icon" id="muteBtn" aria-label="Mute">
          <svg class="i-vol" viewBox="0 0 24 24"><path d="M4 9v6h4l5 5V4L8 9zm12.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
          <svg class="i-mute" viewBox="0 0 24 24"><path d="M4 9v6h4l5 5V4L8 9zm15.6 3 2.1-2.1-1.4-1.4-2.1 2.1-2.1-2.1-1.4 1.4 2.1 2.1-2.1 2.1 1.4 1.4 2.1-2.1 2.1 2.1 1.4-1.4z"/></svg>
        </button>
        <select id="speedSelect" aria-label="Playback speed">
          <option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option>
        </select>
        <button class="icon" id="fsBtn" aria-label="Fullscreen">
          <svg viewBox="0 0 24 24"><path d="M5 5h5v2H7v3H5zm9 0h5v5h-2V7h-3zM5 14h2v3h3v2H5zm12 3v-3h2v5h-5v-2z"/></svg>
        </button>
      </div>
      <p class="hint muted">Space play/pause · ← → step one frame · click a comment to jump to it</p>
    </section>

    <aside class="comments-col">
      <div class="comments-head">
        <h2><span id="lblComments"></span> <span class="count" id="commentCount">0</span></h2>
        <div class="filters" id="filters"></div>
      </div>
      <div class="comment-list" id="commentList"></div>
      <form class="composer" id="composer" autocomplete="off">
        <input id="authorInput" class="author" maxlength="80">
        <textarea id="commentInput" rows="3" maxlength="4000" dir="auto"></textarea>
        <div class="composer-row">
          <label class="tc-chip"><input type="checkbox" id="attachTc" checked> <span id="lblAt"></span> <b id="composerTc">00:00:00:00</b></label>
          <button class="btn" id="sendBtn" type="submit"></button>
        </div>
        <div class="replying" id="replying" hidden></div>
      </form>
    </aside>
  </main>

  <section class="portfolio" id="portfolioSection" hidden>
    <h2 id="portfolioTitle"></h2>
    <div class="portfolio-grid" id="portfolioGrid"></div>
  </section>

  <footer class="footer" id="footer"></footer>

  <div class="modal" id="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-box">
      <button class="icon modal-close" data-close aria-label="Close">
        <svg viewBox="0 0 24 24"><path d="M18.3 5.7 12 12l6.3 6.3-1.4 1.4L10.6 13.4 4.3 19.7 2.9 18.3 9.2 12 2.9 5.7 4.3 4.3l6.3 6.3 6.3-6.3z"/></svg>
      </button>
      <div class="modal-frame" id="modalFrame"></div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>
  <script src="app.js"></script>
</body>
</html>
